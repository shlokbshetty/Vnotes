<!-- Micro-interactions Script -->
<script>
        // Simple toggle for the speaker switch
        document.querySelector('.group-hover\\:bg-primary-container').parentNode.addEventListener('click', function() {
            const toggle = this.querySelector('div > div');
            const bg = this.querySelector('div');
            if(toggle.classList.contains('translate-x-5')) {
                toggle.classList.remove('translate-x-5');
                bg.classList.remove('bg-primary');
            } else {
                toggle.classList.add('translate-x-5');
                bg.classList.add('bg-primary');
            }
        });

        // Close modal logic (simplified)
        document.getElementById('modal-backdrop').addEventListener('click', function(e) {
            if(e.target === this) {
                this.classList.add('opacity-0');
                this.querySelector('div').classList.add('scale-95');
                setTimeout(() => this.style.display = 'none', 300);
            }
        });
    </script>
